spec:
  destination:
    server: https://kubernetes.default.svc
  source:
    repoURL: YOUR_REPO_URL
    targetRevision: HEAD

cluster:
  top_level_domain: example.com
  name: my-cluster
  admin_email: YOUR_EMAIL
  timezone: YOUR_TIMEZONE

media:
  nfs:
    server: my-nas
    path: /mnt/nfs
# Flow Analyzer site settings. Real values are Argo parameters on the
# cluster Application (flowAnalyzer.*), not in git.
flowAnalyzer:
  network:
    ip: ""
    prefixLength: "24"
  allowedExporters: ""
  internalSubnets: ""
  knownNetworks: ""
  dnsServer: ""
  probeTargets: ""
