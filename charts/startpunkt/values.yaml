# Upstream chart (oci://ghcr.io/ullbergm/charts/startpunkt).
startpunkt:
  # Three Deployments: controller (the only one with a service account
  # token), api and web.
  mode: split
  # image.tag is left at its default, the version of the chart.
  # crds.install is left at its default: this release owns the Application
  # and Bookmark definitions and upgrades them with the chart. They are kept
  # if the release is removed.
  availability:
    enabled: false
  resources:
    controller:
      requests: {cpu: 10m, memory: 48Mi}
      limits: {memory: 192Mi}
    api:
      requests: {cpu: 5m, memory: 24Mi}
      limits: {memory: 96Mi}
    web:
      requests: {cpu: 5m, memory: 16Mi}
      limits: {memory: 64Mi}
  # Routes are in templates/route.yaml (cluster naming scheme).
  route:
    enabled: false
