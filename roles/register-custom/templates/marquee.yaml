# marquee: the movie manager. Argo installs the chart from a private OCI
# registry. Three Secrets are made by hand and are not in git: the
# repository credential for ghcr.io/ullbergm/charts in openshift-gitops,
# and ghcr-pull (image pulls) and marquee-key (the API key) in the
# marquee namespace.
---
kind: Namespace
apiVersion: v1
metadata:
  name: marquee
---
kind: PersistentVolume
apiVersion: v1
metadata:
  name: marquee-data-volume
spec:
  capacity:
    storage: 1Mi
  nfs:
    server: {{ .Values.media.nfs.server }}
    path: {{ .Values.media.nfs.path }}
  accessModes:
    - ReadWriteMany
  claimRef:
    namespace: marquee
    name: marquee-data-volume
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - nfsvers=4.1
    - nconnect=8
    - hard
    - noatime
    - rsize=131072
    - wsize=131072
  volumeMode: Filesystem
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: marquee-data-volume
  namespace: marquee
  labels:
    kasten/skip: 'true'
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Mi
  volumeName: marquee-data-volume
  storageClassName: ''
  volumeMode: Filesystem
---
apiVersion: startpunkt.ullberg.us/v1
kind: Application
metadata:
  name: marquee
  namespace: marquee
spec:
  name: marquee
  group: Media
  icon: movie-open
  iconColor: ""
  url: https://marquee.apps.{{ .Values.cluster.name }}.{{ .Values.cluster.top_level_domain }}
  info: Manages your movie library
  location: 0
---
# No resources-finalizer: deleting this Application must not delete the
# chart's CRDs, which would delete the whole library's objects with them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: marquee
  namespace: openshift-gitops
spec:
  destination:
    namespace: marquee
    server: {{ .Values.spec.destination.server }}
  project: default
  source:
    repoURL: ghcr.io/ullbergm/charts
    chart: marquee
    # renovate: datasource=docker depName=ghcr.io/ullbergm/charts/marquee
    targetRevision: 0.17.18
    helm:
      releaseName: marquee
      valuesObject:
        openshift:
          enabled: true
        storage:
          mediaClaim: marquee-data-volume
        apiKey:
          existingSecret: marquee-key
        # Both apps' claims are the same NFS export, so each keeps its
        # poster cache in a folder of its own. The chart's default (.covers)
        # is one folder for both, and their numbered files overwrite each other.
        metadata:
          covers:
            subPath: marquee/covers
        image:
          pullSecrets:
            - ghcr-pull
        # Programme's web app and playback API read /api/v1 from their own
        # namespace.
        networkPolicy:
          api:
            ingressFrom:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: programme
        # The charts' default limit (256Mi) is too small for this library:
        # the operator and the api keep every title in memory and were
        # killed for running out of it.
        # The operator also keeps every finished artwork job of a whole-library
        # run, which takes it past 1Gi.
        operator:
          resources:
            requests:
              cpu: 10m
              memory: 256Mi
            limits:
              memory: 2Gi
        api:
          resources:
            requests:
              cpu: 10m
              memory: 256Mi
            limits:
              memory: 1Gi
          route:
            enabled: false
            tls:
              termination: edge
              insecureEdgeTerminationPolicy: Redirect
        spa:
          route:
            enabled: true
            host: marquee.apps.{{ .Values.cluster.name }}.{{ .Values.cluster.top_level_domain }}
            tls:
              termination: edge
              insecureEdgeTerminationPolicy: Redirect
        # Argo owns only the fields set here; the rest is configured in the UI.
        marqueeConfig:
          annotations:
            argocd.argoproj.io/sync-options: ServerSideApply=true
        trashGuide:
          create: false
  # Argo CD 2.12 does not know the Deployment status field
  # terminatingReplicas, which fails the whole comparison, and reads the
  # API server's defaults on the admission policy as drift.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status/terminatingReplicas
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicy
      jqPathExpressions:
        - .spec.matchConstraints.matchPolicy
        - .spec.matchConstraints.namespaceSelector
        - .spec.matchConstraints.objectSelector
        - .spec.matchConstraints.resourceRules[].scope
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicyBinding
      jqPathExpressions:
        - .spec.matchResources.matchPolicy
        - .spec.matchResources.objectSelector
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
