# episodic: the series manager. Argo installs the chart from a private OCI
# registry. Three Secrets are made by hand and are not in git: the
# repository credential for ghcr.io/ullbergm/charts in openshift-gitops,
# and ghcr-pull (image pulls) and episodic-key (the API key) in the
# episodic namespace.
---
kind: Namespace
apiVersion: v1
metadata:
  name: episodic
---
kind: PersistentVolume
apiVersion: v1
metadata:
  name: episodic-data-volume
spec:
  capacity:
    storage: 1Mi
  nfs:
    server: {{ .Values.media.nfs.server }}
    path: {{ .Values.media.nfs.path }}
  accessModes:
    - ReadWriteMany
  claimRef:
    namespace: episodic
    name: episodic-data-volume
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - nfsvers=4.1
    - nconnect=8
    - hard
    - noatime
    - rsize=131072
    - wsize=131072
  volumeMode: Filesystem
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: episodic-data-volume
  namespace: episodic
  labels:
    kasten/skip: 'true'
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Mi
  volumeName: episodic-data-volume
  storageClassName: ''
  volumeMode: Filesystem
---
apiVersion: startpunkt.ullberg.us/v1
kind: Application
metadata:
  name: episodic
  namespace: episodic
spec:
  name: episodic
  group: Media
  icon: television-box
  iconColor: ""
  url: https://episodic.apps.{{ .Values.cluster.name }}.{{ .Values.cluster.top_level_domain }}
  info: Manages your TV show library
  location: 0
---
# No resources-finalizer: deleting this Application must not delete the
# chart's CRDs, which would delete the whole library's objects with them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: episodic
  namespace: openshift-gitops
spec:
  destination:
    namespace: episodic
    server: {{ .Values.spec.destination.server }}
  project: default
  source:
    repoURL: ghcr.io/ullbergm/charts
    chart: episodic
    # renovate: datasource=docker depName=ghcr.io/ullbergm/charts/episodic
    targetRevision: 0.14.4
    helm:
      releaseName: episodic
      valuesObject:
        openshift:
          enabled: true
        storage:
          mediaClaim: episodic-data-volume
        apiKey:
          existingSecret: episodic-key
        # Both apps' claims are the same NFS export, so each keeps its
        # poster cache in a folder of its own. The chart's default (.covers)
        # is one folder for both, and their numbered files overwrite each other.
        metadata:
          covers:
            subPath: episodic/covers
        image:
          pullSecrets:
            - ghcr-pull
        # The charts' default limit (256Mi) is too small for this library:
        # the operator and the api keep every title in memory and were
        # killed for running out of it.
        operator:
          resources:
            requests:
              cpu: 10m
              memory: 256Mi
            limits:
              memory: 1Gi
        sonarrShim:
          resources:
            requests:
              cpu: 10m
              memory: 256Mi
            limits:
              memory: 1Gi
        api:
          resources:
            requests:
              cpu: 10m
              memory: 256Mi
            limits:
              memory: 1Gi
          route:
            enabled: false
            tls:
              termination: edge
              insecureEdgeTerminationPolicy: Redirect
        spa:
          route:
            enabled: true
            host: episodic.apps.{{ .Values.cluster.name }}.{{ .Values.cluster.top_level_domain }}
            tls:
              termination: edge
              insecureEdgeTerminationPolicy: Redirect
        # Argo owns only the fields set here; the rest is configured in the UI.
        episodicConfig:
          annotations:
            argocd.argoproj.io/sync-options: ServerSideApply=true
          # Skip markers (intros): the operator analyses a series when it
          # gets a new file, and the rest of the library a little each
          # night (01:00 UTC for five hours). What an analysis keeps goes
          # in a folder of the app's own on the media claim.
          sidecars:
            overlay:
              subPath: episodic/overlay
          spec:
            mediaManagement:
              analysis:
                enabled: true
        trashGuide:
          create: false
  # Argo CD 2.12 does not know the Deployment status field
  # terminatingReplicas, which fails the whole comparison, and reads the
  # API server's defaults on the admission policy as drift.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status/terminatingReplicas
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicy
      jqPathExpressions:
        - .spec.matchConstraints.matchPolicy
        - .spec.matchConstraints.namespaceSelector
        - .spec.matchConstraints.objectSelector
        - .spec.matchConstraints.resourceRules[].scope
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicyBinding
      jqPathExpressions:
        - .spec.matchResources.matchPolicy
        - .spec.matchResources.objectSelector
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
